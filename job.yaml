apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-chown
  namespace: kube-ops
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: grafana-chwon
        command: ["chown","-R","472:472","/var/lib/grafana"]
        image: busybox
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /var/lib/grafana
            subPath: grafana
            name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana

