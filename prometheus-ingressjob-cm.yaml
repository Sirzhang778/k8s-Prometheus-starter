apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kube-ops
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 30s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets:
              - 'localhost:9090'

      - job_name: 'ingress-nginx'
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'ingress-nginx-nginx-ingress-controller-metrics.ingress.svc.cluster.local:9913'
